<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jobify Quick-Copy SidePanel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #ffffff; color: #0f172a; padding: 12px 14px; }
    .hdr { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .logo {
      width: 26px; height: 26px; border-radius: 7px;
      background: linear-gradient(135deg, #0d9488, #0284c7);
      color: #fff; font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center;
    }
    .title { font-size: 14px; font-weight: 800; color: #0f172a; }
    .sub { font-size: 10.5px; color: #64748b; }
    .btn {
      background: linear-gradient(135deg, #0d9488, #0284c7); color: #fff; border: none;
      border-radius: 8px; padding: 8px 11px; font-size: 11.5px; font-weight: 700; cursor: pointer;
    }
    .btn:hover { opacity: 0.94; }
    .btn.sec { background: #f8fafc; color: #0f172a; border: 1px solid #cbd5e1; }
    .btn.sec:hover { background: #f1f5f9; }
    .btn.hub { background: #f0fdfa; color: #0f766e; border: 1px solid #99f6e4; padding: 5px 9px; font-size: 11px; }
    .section { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 11px; padding: 11px; margin-bottom: 11px; }
    .sec-title { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .copy-card {
      background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 7px 9px;
      text-align: left; color: #0f172a; cursor: pointer; transition: border-color 0.14s;
    }
    .copy-card:hover { border-color: #0d9488; background: #f0fdfa; }
    .k { font-size: 9.5px; color: #64748b; font-weight: 700; text-transform: uppercase; display: block; }
    .v { font-size: 11.5px; font-weight: 600; color: #0f172a; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .exp-block, .sa-block {
      background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 9px; margin-bottom: 7px;
    }
    .toast {
      position: fixed; bottom: 12px; left: 12px; right: 12px; background: #0f766e; color: #ffffff;
      padding: 8px 12px; border-radius: 8px; font-size: 11.5px; font-weight: 700; display: none; text-align: center;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.18);
    }
  </style>
</head>
<body>
  <div class="hdr">
    <div class="brand">
      <div class="logo">J</div>
      <div>
        <div class="title">Jobify SidePanel</div>
        <div class="sub">1-Click Autofill &amp; Quick-Copy</div>
      </div>
    </div>
    <button class="btn hub" id="sp-hub">Hub ↗</button>
  </div>

  <div class="section">
    <div class="sec-title">Active Tab Actions</div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <button class="btn" id="sp-full-auto" style="width:100%;">
        🚀 Tailor &amp; Auto-Apply
      </button>
      <div class="grid">
        <button class="btn sec" id="sp-fill-only" style="width:100%;">⚡ Autofill Page</button>
        <button class="btn sec" id="sp-fast-auto" style="width:100%;color:#0f766e;border-color:#99f6e4;">⚡ Fast Apply</button>
      </div>
      <div id="sp-live-status" style="font-size:11px;color:#0f766e;font-weight:700;min-height:14px;"></div>
    </div>
  </div>

  <div class="section">
    <div class="sec-title">Tap Any Field to Copy</div>
    <div class="grid" id="sp-identity-grid"></div>
  </div>

  <div class="section">
    <div class="sec-title">Work Experience Bullets</div>
    <div id="sp-exp-list"></div>
  </div>

  <div class="section">
    <div class="sec-title">Saved Common Answers</div>
    <div id="sp-sa-list"></div>
  </div>

  <div class="toast" id="sp-toast">Copied!</div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
