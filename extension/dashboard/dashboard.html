<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jobify Hub — Tsenta-Style Autonomous Job Copilot, Auto-Apply &amp; Tracker</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="app-layout">
    <header class="tsenta-navbar">
      <div class="tsenta-navbar-inner">
        <div class="brand-box">
          <div class="brand-logo">J</div>
          <div>
            <div class="brand-name">Jobify</div>
            <div class="brand-tag">Autonomous Career Suite</div>
          </div>
        </div>

        <nav class="nav-list" id="main-nav" aria-label="Primary Sections">
          <button class="nav-item active" data-view="overview" data-primary-tab="true">📊 Dashboard</button>
          <button class="nav-item" data-view="jobs" data-primary-tab="true">🔍 Browse Jobs</button>
          <button class="nav-item" data-view="autopilot" data-primary-tab="true">⚡ Auto Apply</button>
          <button class="nav-item" data-view="tracker" data-primary-tab="true">📋 Tracker</button>
          <button class="nav-item" data-view="vault" data-primary-tab="true">👤 Profile</button>
          <span class="nav-divider" aria-hidden="true"></span>
          <button class="nav-item nav-studio" data-view="resume">✨ Resume AI</button>
          <button class="nav-item nav-studio" data-view="cover">📝 Cover Letter</button>
          <button class="nav-item nav-studio" data-view="interview">🎤 Interview Prep</button>
          <button class="nav-item nav-studio" data-view="network">🤝 Referrals</button>
        </nav>

        <div class="navbar-right">
          <span class="queue-pill" id="topbar-queue-pill" style="display:none;">⚡ Auto-Apply Idle</span>
          <span class="model-pill" id="topbar-model-pill">Gemini 3.5 Flash</span>
          <div class="user-pill" title="Candidate Profile">
            <div class="avatar">RV</div>
            <div class="user-pill-meta">
              <div class="u-name" id="sb-user-name">Raviteja Velanati</div>
              <div class="u-email" id="sb-user-email">ravitejavelanati11@gmail.com</div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="main-panel">
      <div class="topbar">
        <div>
          <h1 class="view-title" id="topbar-title">Dashboard</h1>
          <p class="view-sub" id="topbar-sub">Top job matches, 1-click Apply to All 5 &amp; live application tracker</p>
        </div>
      </div>

      <div class="content-area" id="view-container"></div>
    </main>
  </div>

  <div class="hub-modal-backdrop" id="hub-receipt-modal" style="display:none;">
    <div class="hub-modal-box">
      <div class="hub-modal-header">
        <div id="hub-receipt-title" class="hub-modal-title">Submission Receipt &amp; Tailored Résumé Diff</div>
        <button type="button" class="btn sm secondary" id="hub-receipt-close">✕ Close</button>
      </div>
      <div id="hub-receipt-body" class="hub-modal-body"></div>
    </div>
  </div>

  <div class="global-toast" id="global-toast"></div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
