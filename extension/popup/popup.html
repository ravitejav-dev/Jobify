<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jobify Copilot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-shell">
    <header class="hdr">
      <div class="brand">
        <div class="logo">J</div>
        <div>
          <div class="title">Jobify</div>
          <div class="sub" id="candidate-line">Raviteja Velanati</div>
        </div>
      </div>
      <div class="hdr-actions">
        <button class="hdr-btn icon" id="btn-reload-ext" title="Reload Extension">↻</button>
        <button class="hdr-btn" id="btn-sidepanel" title="Open Quick-Copy SidePanel">SidePanel</button>
        <button class="hdr-btn primary-link" id="btn-dashboard" title="Open Full Career Hub">Hub ↗</button>
      </div>
    </header>

    <section class="live-banner" id="popup-live-banner">
      <div class="live-banner-row">
        <div style="overflow:hidden;">
          <div class="live-step" id="popup-live-step">Auto-Apply Running...</div>
          <div class="live-detail" id="popup-live-detail"></div>
        </div>
        <button class="btn danger-sm" id="btn-stop-auto">■ Stop</button>
      </div>
    </section>

    <section class="card" id="active-page-card">
      <div class="row-between">
        <span class="badge-ats" id="page-ats">Detecting Tab...</span>
        <span class="badge-score" id="page-score">Standby</span>
      </div>
      <div class="job-title" id="page-title">Active Browser Tab</div>
      <div class="job-company" id="page-company">Open a job posting to autofill in 1 click</div>

      <button class="btn auto-hero" id="btn-full-auto">🚀 Tailor &amp; Auto-Apply</button>
      <div class="grid-2" style="margin-top:7px;">
        <button class="btn secondary" id="btn-autofill" title="Fill current screen only without submitting">⚡ Autofill Page</button>
        <button class="btn fast-auto" id="btn-fast-auto" title="Fast Fill &amp; Auto-Submit with Default Resume">⚡ Fast Apply</button>
      </div>

      <div class="card-footer-strip">
        <label class="toggle-inline" for="chk-auto-submit" title="Automatically click final Submit when ready">
          <input type="checkbox" id="chk-auto-submit" checked />
          <span>Auto-submit</span>
        </label>
        <div style="display:flex;gap:5px;">
          <button class="chip-btn" id="btn-open-drawer" title="Open In-Page Copilot Panel">Panel</button>
          <button class="chip-btn" id="btn-bookmark" title="Save Job to Tracker">📌 Save</button>
        </div>
      </div>
    </section>

    <section class="stats-grid" id="stats-strip" title="Click to open Application Tracker in Hub">
      <div class="stat-box">
        <span class="stat-num" id="st-saved">0</span>
        <span class="stat-lbl">Saved</span>
      </div>
      <div class="stat-box">
        <span class="stat-num" id="st-applied">0</span>
        <span class="stat-lbl">Applied</span>
      </div>
      <div class="stat-box">
        <span class="stat-num" id="st-interview">0</span>
        <span class="stat-lbl">Interviews</span>
      </div>
    </section>

    <footer class="ftr-row">
      <button class="btn ghost" id="btn-jobs">🔍 Browse Live Matched Jobs ↗</button>
    </footer>

    <div class="status-toast" id="status-msg"></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
